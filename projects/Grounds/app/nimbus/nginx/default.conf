upstream nimbus_api {
    server api:8080;
}

upstream nimbus_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://nimbus_api/health;
    }

    location /api/ {
        proxy_pass http://nimbus_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://nimbus_web/;
    }
}
