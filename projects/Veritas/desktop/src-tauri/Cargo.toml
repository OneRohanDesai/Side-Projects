[package]
name = "veritas-desktop"
version = "0.7.0"
description = "VERITAS desktop shell"
authors = ["VERITAS"]
edition = "2021"
license = "LicenseRef-Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "veritas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
