apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-table
  namespace: thetable
  labels:
    app: the-table
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: the-table
  template:
    metadata:
      labels:
        app: the-table
    spec:
      containers:
        - name: app
          image: the-table:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: the-table-data
