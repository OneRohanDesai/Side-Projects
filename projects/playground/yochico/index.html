<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YO Chico Physical Routine</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0}
header{background:linear-gradient(135deg,#ff6b6b,#ffd93d);color:#fff;padding:20px;text-align:center}
main{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
button.acc{width:100%;padding:12px;border:none;background:#ffd93d;margin:6px 0;text-align:left;font-size:17px;border-radius:6px;cursor:pointer}
button.acc.active,button.acc:hover{background:#ff6b6b;color:#fff}
.panel{max-height:0;overflow:hidden;transition:max-height .2s ease;padding:0 10px}
</style>
</head>
<body>
<header><h1>YO Chico Physical Routine</h1><p>No Equipment • Fat Loss Focus • Face Routine Every Day</p></header>
<main>
<h2 id="title"></h2>
<div id="list"></div>
</main>
<script>
const face=[
["Jawline Clench","10-15 reps"],
["Neck Curl-Ups","10-12 reps"],
["Chin Lifts","10-15 reps"],
["Fish Face","10 reps"],
["Resistance Smile","10 reps"],
["Tongue Press","10-15 reps"],
["Side Jaw Move","5 sec each side"],
["Whistle Technique","10-15 reps"],
["Vowel Sounds","10 each vowel"],
["Chewing Gum","10-15 min sugar-free"]
];
const days=[
{d:"Sunday",t:"Recovery + Walking",w:["45-60 min brisk walk","Stretch 10 min","Hydrate well"]},
{d:"Monday",t:"Chest + HIIT",w:["Warm-up 5 min","Push-ups 4x12-20","Incline Push-ups 3x15","Wide Push-ups 3x12","Diamond Push-ups 3x10","Plank to Push-up 3x40 sec","Mountain Climbers 4x45 sec","Burpees 4x15","Jumping Jacks 5x1 min","Walk 20-30 min"]},
{d:"Tuesday",t:"Full Body Fat Burn",w:["Warm-up","Burpees 5x15","High Knees 5x1 min","Mountain Climbers 5x45 sec","Jump Squats 4x20","Push-ups 3 sets","Plank 3x60 sec","Walk 30-40 min"]},
{d:"Wednesday",t:"Upper Body",w:["Warm-up","Push-ups 5x15","Diamond Push-ups 4x12","Close Grip Push-ups 4x12","Pike Push-ups 3x12","Mountain Climbers 4x1 min","Walk 20 min"]},
{d:"Thursday",t:"HIIT",w:["Burpees 5x15","Jumping Jacks 5x1 min","Mountain Climbers 5x45 sec","High Knees 5x45 sec","Run in Place 10 min","Walk 20 min"]},
{d:"Friday",t:"Upper Body Endurance",w:["Push-ups 5 sets","Diamond Push-ups 4x12","Wide Push-ups 4x15","Close Grip Push-ups 4x12","Plank 4x60 sec","Burpees 5x12","Walk 30 min"]},
{d:"Saturday",t:"Long Fat Burn",w:["45-60 min brisk walk or jog","Mountain Climbers 5x45 sec","Burpees 4x15","Jumping Jacks 5x1 min","High Knees 5x45 sec","Stretch 10 min"]}
];
const today=days[new Date().getDay()];
title.innerText=`Today's Workout: ${today.t} (${today.d})`;
const all=[["🔥 Daily Face Routine",face.map(x=>x[0]+" - "+x[1])],["💪 Today's Workout",today.w]];
all.forEach(sec=>{
 let b=document.createElement("button");b.className="acc";b.textContent=sec[0];
 let p=document.createElement("div");p.className="panel";
 sec[1].forEach(s=>{let e=document.createElement("p");e.textContent="• "+s;p.appendChild(e);});
 list.appendChild(b);list.appendChild(p);
});
document.querySelectorAll(".acc").forEach(a=>a.onclick=()=>{a.classList.toggle("active");let p=a.nextElementSibling;p.style.maxHeight=p.style.maxHeight?null:p.scrollHeight+"px";});
</script>
</body></html>
