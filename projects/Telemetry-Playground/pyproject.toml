[project]
name = "telemetry-playground"
version = "1.0.0"
description = "Synthetic distributed system for DevOps, SRE and observability experiments"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
