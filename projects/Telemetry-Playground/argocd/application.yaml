apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-playground
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/OneRohanDesai/Telemetry-Playground.git
    targetRevision: main
    path: deploy/helm/telemetry-playground
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
