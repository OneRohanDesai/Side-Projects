namespace: telemetry

image:
  generator: ghcr.io/onerohandesai/telemetry-generator
  receiver: ghcr.io/onerohandesai/telemetry-receiver
  dashboard: ghcr.io/onerohandesai/telemetry-dashboard
  nginx: ghcr.io/onerohandesai/telemetry-nginx
  redis: redis:7-alpine

imageTag: 87c6addff5446d66aba241ffbfa029b9ab243f1d
imagePullPolicy: IfNotPresent

replicas:
  generator: 3
  receiver: 3
  dashboard: 1
  nginx: 1
  redis: 1

service:
  type: ClusterIP

ingress:
  enabled: true
  host: telemetry.local
  className: nginx

config:
  redisHost: redis
  redisPort: "6379"
  receiverUrl: http://nginx/receive
  otelEndpoint: otel-collector.observability.svc.cluster.local:4317
  otelInsecure: "true"
  logLevel: INFO
  environment: dev
  region: local

resources:
  generator:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  receiver:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  dashboard:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nginx:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  redis:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  # minAvailable is clamped in templates when replicas are low
  minAvailable: 1

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
