apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ include "telemetry.namespace" . }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app: dashboard
spec:
  replicas: {{ .Values.replicas.dashboard }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        {{- include "telemetry.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: dashboard
          image: {{ include "telemetry.image" (list .Values.image.dashboard .Values.imageTag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: GENERATOR_REPLICAS
              value: {{ .Values.replicas.generator | quote }}
            - name: REDIS_HOST
              value: {{ .Values.config.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.config.redisPort | quote }}
            - name: OTEL_SERVICE_NAME
              value: dashboard
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=telemetry
            {{- include "telemetry.otelEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.resources.dashboard.requests.cpu }}
              memory: {{ .Values.resources.dashboard.requests.memory }}
            limits:
              cpu: {{ .Values.resources.dashboard.limits.cpu }}
              memory: {{ .Values.resources.dashboard.limits.memory }}
