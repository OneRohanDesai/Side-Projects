name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Generator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/generator/Dockerfile
          push: true
          tags: |
            ghcr.io/onerohandesai/telemetry-generator:${{ env.IMAGE_TAG }}
            ghcr.io/onerohandesai/telemetry-generator:latest
          cache-from: type=gha,scope=generator
          cache-to: type=gha,mode=max,scope=generator

      - name: Build and Push Receiver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/receiver/Dockerfile
          push: true
          tags: |
            ghcr.io/onerohandesai/telemetry-receiver:${{ env.IMAGE_TAG }}
            ghcr.io/onerohandesai/telemetry-receiver:latest
          cache-from: type=gha,scope=receiver
          cache-to: type=gha,mode=max,scope=receiver

      - name: Build and Push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/onerohandesai/telemetry-dashboard:${{ env.IMAGE_TAG }}
            ghcr.io/onerohandesai/telemetry-dashboard:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/onerohandesai/telemetry-nginx:${{ env.IMAGE_TAG }}
            ghcr.io/onerohandesai/telemetry-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Update Helm Image Tag
        run: |
          sed -i "s/^imageTag:.*/imageTag: ${IMAGE_TAG}/" deploy/helm/telemetry-playground/values.yaml

      - name: Commit Updated Image Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy/helm/telemetry-playground/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update image tag to ${IMAGE_TAG}"
          git push
