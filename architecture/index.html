<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Museum catalog of man-made and natural structures across deep time." />
  <title>Vault · Structures across time</title>
  <link rel="stylesheet" href="./css/vault.css" />
</head>
<body>
  <div class="boot" id="bootScreen" aria-live="polite" aria-busy="true">
    <div class="boot-inner">
      <div class="boot-mark">Vault</div>
      <div class="boot-rule" aria-hidden="true"></div>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="boot-copy">Opening the catalog</p>
    </div>
  </div>

  <header class="masthead">
    <div class="mast-top">
      <div class="identity">
        <div class="mark">Vault · Catalog</div>
        <h1>Structures<br/>across time</h1>
        <p class="tagline">
          A museum plate of human works and natural forms, ordered by when they first mattered.
          Light pages. No spectacle.
        </p>
      </div>
      <div class="mast-tools">
        <div class="tool-row">
          <div class="seg" role="group" aria-label="Kind">
            <button type="button" class="active" data-kind="all">All</button>
            <button type="button" data-kind="man-made">Man-made</button>
            <button type="button" class="nat" data-kind="natural">Natural</button>
          </div>
          <input class="search" id="search" type="search" placeholder="Find a place or name" autocomplete="off" />
        </div>
        <a class="link-out" href="../">← Side Projects</a>
      </div>
    </div>
    <nav class="era-rail" id="eraRail" aria-label="Eras"></nav>
  </header>

  <main class="stage">
    <div class="meta-bar">
      <span id="countStat"><b>—</b> plates</span>
      <span>△ human hand · ◎ earth form · deep past → now</span>
    </div>
    <div class="catalog" id="timeline" aria-live="polite">
      <div class="empty">Opening the catalog…</div>
    </div>
  </main>

  <div class="sheet" id="drawer" aria-hidden="true">
    <div class="sheet-card" id="drawerBody" role="dialog" aria-label="Structure plate"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/vault.js" defer></script>
</body>
</html>
