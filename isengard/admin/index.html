<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Manage — Isengard</title><link rel="stylesheet" href="../assets/styles.css"></head>
<body><header class="site-header"><a class="brand" href="../"><span class="brand-mark">I</span><span>Isengard</span></a><nav><a href="../">View site</a></nav></header><main class="admin-shell"><section id="login" class="login-card"><p class="eyebrow">Keeper access</p><h1>Manage the library.</h1><p>Enter the admin token you configured as the Worker secret.</p><form id="login-form"><label>Admin token<input type="password" id="token" autocomplete="current-password" required></label><button class="button button-dark">Continue</button></form><p class="quiet">Stored only in this browser session.</p></section><section id="admin" hidden><div class="admin-title"><div><p class="eyebrow">Keeper access</p><h1>Playbooks</h1></div><div><button id="new-post" class="button button-dark">New playbook</button><button id="sign-out" class="text-button">Sign out</button></div></div><div id="admin-message" class="feedback-message" aria-live="polite"></div><div id="admin-list" class="admin-list"></div><section id="editor" class="editor" hidden><div class="editor-heading"><h2 id="editor-title">New playbook</h2><button id="cancel-edit" class="text-button">Cancel</button></div><form id="playbook-form"><input type="hidden" name="id"><div class="form-grid"><label>Title<input name="title" required maxlength="160"></label><label>Slug<input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" maxlength="160" placeholder="restart-a-kubernetes-deployment"></label><label>Category<input name="category" required maxlength="60" placeholder="Kubernetes"></label><label>Reading time<input name="reading_time" maxlength="30" placeholder="6 min read"></label></div><label>Summary<textarea name="summary" required maxlength="400"></textarea></label><label>Tags <span class="quiet">comma separated</span><input name="tags" maxlength="300" placeholder="kubernetes, incidents, deployment"></label><label>Playbook content <span class="quiet">Markdown supported</span><textarea name="content" class="content-input" required placeholder="# Goal\n\nWhat this playbook achieves…\n\n## Steps\n\n1. Start here"></textarea></label><div class="editor-actions"><button class="button button-dark">Publish changes</button><button type="button" id="delete-post" class="danger-button" hidden>Delete playbook</button></div></form></section></section></main><footer><span>Isengard</span><span>Private keeper console</span></footer><script src="../assets/admin.js" defer></script></body></html>
